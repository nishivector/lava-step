<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lava Step</title>
<script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/dist/Tone.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#C4612A;font-family:monospace}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s}
.screen.hidden{opacity:0;pointer-events:none}
#startScreen{background:rgba(43,16,0,0.55)}
#instrScreen{background:rgba(43,16,0,0.85);gap:20px}
.instr-title{color:#F5D060;font-size:clamp(16px,4vw,22px);letter-spacing:0.25em;text-transform:uppercase}
.instr-rule{color:#EFF0E8;font-size:clamp(12px,3vw,15px);letter-spacing:0.1em;text-align:center;line-height:1.8}
.tap-hint{color:#F5D060;font-size:clamp(11px,2.5vw,13px);margin-top:16px;animation:blink 1s infinite;letter-spacing:0.2em}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#flash{position:fixed;inset:0;z-index:9;background:#FF3A1A;opacity:0;pointer-events:none;transition:opacity 0.08s}
#levelBanner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;color:#F5D060;font-size:clamp(24px,6vw,40px);letter-spacing:0.3em;text-shadow:0 0 30px #F5D060;opacity:0;pointer-events:none;transition:opacity 0.4s;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>

<div id="startScreen" class="screen">
  <svg width="100%" height="130" viewBox="0 0 400 130" style="max-width:500px;overflow:visible">
    <defs>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <text x="50%" y="72" text-anchor="middle" font-family="monospace" font-size="52"
          font-weight="900" fill="#F5D060" filter="url(#glow)"
          style="animation:titleReveal 1.2s ease-out forwards;opacity:0">LAVA STEP</text>
  </svg>
  <style>
    @keyframes titleReveal{from{opacity:0;letter-spacing:20px}to{opacity:1;letter-spacing:6px}}
    .bracket{position:fixed;width:30px;height:30px;border-color:#F5D060;border-style:solid;opacity:0;animation:drawBracket 0.8s ease-out forwards}
    .tl{top:20px;left:20px;border-width:2px 0 0 2px;animation-delay:0.2s}
    .tr{top:20px;right:20px;border-width:2px 2px 0 0;animation-delay:0.3s}
    .bl{bottom:20px;left:20px;border-width:0 0 2px 2px;animation-delay:0.4s}
    .br{bottom:20px;right:20px;border-width:0 2px 2px 0;animation-delay:0.5s}
    @keyframes drawBracket{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:scale(1)}}
  </style>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
  <p style="color:#EFF0E8;font-size:clamp(10px,2.5vw,13px);letter-spacing:0.15em;margin-top:8px;opacity:0.8">TAP THE LAVA TO FREEZE IT</p>
  <p class="tap-hint">TAP TO BEGIN</p>
</div>

<div id="instrScreen" class="screen hidden">
  <p class="instr-title">HOW TO PLAY</p>
  <p class="instr-rule">TAP GLOWING LAVA AHEAD OF YOU<br>TO FREEZE A CRYSTAL PLATFORM</p>
  <p class="instr-rule" style="color:#F5D060">TAP EARLIER = HIGHER MULTIPLIER<br>×2 · ×3 · ×4</p>
  <p class="instr-rule" style="font-size:clamp(10px,2.5vw,12px);opacity:0.7">Read shadow angles — they reveal the current speed<br>Faster currents melt your crystal faster</p>
  <p class="tap-hint">TAP TO START</p>
</div>

<div id="flash"></div>
<div id="levelBanner"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ── RENDERER ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xC4612A);
scene.fog = new THREE.Fog(0xC4612A, 22, 42);
const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 12, 12);
camera.lookAt(0, 0, -2);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.55);
composer.addPass(bloom);
scene.add(new THREE.AmbientLight(0xC4612A, 0.6));
const sun = new THREE.DirectionalLight(0xFFAA44, 1.4); sun.position.set(4,10,6); scene.add(sun);
const rimL = new THREE.PointLight(0xF5D060, 0.8, 8); rimL.position.set(-3,3,2); scene.add(rimL);
const lavaGlowL = new THREE.PointLight(0xFF5500, 1.2, 14); lavaGlowL.position.set(0,0.5,-5); scene.add(lavaGlowL);

// ── HUD ───────────────────────────────────────────────────────────────────────
const hud = document.getElementById('hud');
hud.width = window.innerWidth; hud.height = window.innerHeight;
let ctx = null;
function ensureCtx() {
  if (!ctx && hud && typeof hud.getContext === 'function') {
    ctx = hud.getContext('2d');
  }
  return ctx;
}

// ── LEVELS ────────────────────────────────────────────────────────────────────
// channelBands: horizontal lava bands the player walks THROUGH
// zCenter = Z position of band center; player advances in -Z direction
// band width (Z) = 2.0 units; player must cross each band
const LEVELS = [
  { bands:[{zC:-3,spd:1.5},{zC:-8,spd:1.5}],                          pSpd:1.2, boulders:[], speedPulse:false },
  { bands:[{zC:-3,spd:1.5},{zC:-8,spd:3.0,eddy:true},{zC:-13,spd:1.5}], pSpd:1.4, boulders:[], speedPulse:false },
  { bands:[{zC:-3,spd:2.0},{zC:-8,spd:3.5},{zC:-13,spd:2.0}],         pSpd:1.6, boulders:[{band:1}], speedPulse:false },
  { bands:[{zC:-3,spd:1.5},{zC:-7,spd:4.5},{zC:-11,spd:3.0},{zC:-15,spd:4.5}], pSpd:1.8, boulders:[{band:1},{band:3}], speedPulse:false },
  { bands:[{zC:-3,spd:2.0},{zC:-7,spd:5.0},{zC:-11,spd:4.5},{zC:-15,spd:3.5}], pSpd:2.0, boulders:[{band:0},{band:2}], speedPulse:true }
];
const BAND_HALF = 1.0; // half-width in Z of each channel
const EXIT_Z = -22;
const BEAT_MS = 638; // 94 BPM

// ── STATE ─────────────────────────────────────────────────────────────────────
let gameState = 'start';
let score = 0, lives = 3, lvlIdx = 0;
let pZ = 2.0; // player Z, advances toward EXIT_Z
let pSink = 0, sinkTimer = 0, respTimer = 0;
let graceTimer = 0, graceOn = false;
let chkZ = 2.0, crossings = 0, noDeathLvl = true;
let levelStartT = 0, firstCrystal = true;
let lvlDef = LEVELS[0];
let crystals = [], boulderObjs = [], embers = [];
let sceneGroup = new THREE.Group(); scene.add(sceneGroup);
let hasActed = false;

// ── AUDIO ─────────────────────────────────────────────────────────────────────
let audioOk = false;
let bassOsc, bassLFO, arpNotes = ['A5','B5','C#5','E5','G5'], arpIdx = 0;
let sfxCrystal, sfxMelt, sfxDeath, sfxWin;

async function initAudio() {
  if (audioOk) return;
  await Tone.start();
  audioOk = true;
  bassOsc = new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.1,decay:0,sustain:1,release:0.1}}).toDestination();
  bassOsc.volume.value = -18;
  bassOsc.triggerAttack('D1');
  bassLFO = new Tone.LFO(0.15, -6, 2).connect(bassOsc.volume).start();

  sfxCrystal = new Tone.MetalSynth({frequency:1200,envelope:{attack:0.001,decay:0.06,release:0.1},resonance:3200,modulationIndex:32}).toDestination();
  sfxCrystal.volume.value = -8;

  sfxMelt = new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.05,decay:0.6,sustain:0,release:0.1}}).connect(new Tone.Filter(2000,'lowpass').toDestination());
  sfxMelt.volume.value = -18;

  sfxDeath = new Tone.NoiseSynth({noise:{type:'brown'},envelope:{attack:0.01,decay:1.2,sustain:0,release:0.2}}).connect(new Tone.Filter(300,'lowpass').toDestination());
  sfxDeath.volume.value = -12;

  sfxWin = new Tone.PolySynth(Tone.Synth).toDestination();
  sfxWin.volume.value = -12;
}

function playArp() {
  if (!audioOk || !sfxCrystal) return;
  try { sfxCrystal.triggerAttackRelease(arpNotes[arpIdx % arpNotes.length], '16n'); arpIdx++; } catch(e) {}
}

// ── BUILD LEVEL ───────────────────────────────────────────────────────────────
const MAT = {
  basalt: new THREE.MeshStandardMaterial({color:0x1A1008,roughness:0.9}),
  lava:   new THREE.MeshStandardMaterial({color:0xFF4400,emissive:new THREE.Color(0xFF3A1A),emissiveIntensity:1.4,roughness:0.3}),
  crystal:new THREE.MeshStandardMaterial({color:0xEFF0E8,emissive:new THREE.Color(0xF5D060),emissiveIntensity:0.9,roughness:0.1,metalness:0.4,transparent:true,opacity:0.92}),
  exit:   new THREE.MeshStandardMaterial({color:0xF5D060,emissive:new THREE.Color(0xF5D060),emissiveIntensity:2.0}),
  player: new THREE.MeshStandardMaterial({color:0xEFF0E8,emissive:new THREE.Color(0xEFF0E8),emissiveIntensity:0.3}),
  prim:   new THREE.MeshStandardMaterial({color:0xF5D060,emissive:new THREE.Color(0xF5D060),emissiveIntensity:1.0,transparent:true,opacity:0.35}),
};
let playerMesh, playerRim, lavaMeshes = [];

function buildLevel(idx) {
  // Clear
  while (sceneGroup.children.length) sceneGroup.remove(sceneGroup.children[0]);
  crystals.forEach(c => { scene.remove(c.mesh); if (c.shadow) scene.remove(c.shadow); });
  crystals = [];
  boulderObjs.forEach(b => scene.remove(b.mesh)); boulderObjs = [];
  embers.forEach(e => scene.remove(e.mesh)); embers = [];
  lavaMeshes = [];

  lvlDef = LEVELS[idx];
  const bands = lvlDef.bands;

  // Wide floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 60), MAT.basalt.clone());
  floor.rotation.x = -Math.PI/2; floor.position.set(0, -0.05, -16);
  sceneGroup.add(floor);

  // Horizontal lava bands (run left-right at fixed Z positions)
  bands.forEach((b, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(18, BAND_HALF*2), MAT.lava.clone());
    m.rotation.x = -Math.PI/2;
    m.position.set(0, 0.01, b.zC);
    sceneGroup.add(m);
    lavaMeshes.push({ mesh:m, ...b });

    // Basalt basins between bands (dark strips on top of floor)
    if (i < bands.length - 1) {
      const nextZ = bands[i+1].zC;
      const gapW = Math.abs(nextZ - b.zC) - BAND_HALF*2;
      const gapZ = (b.zC + nextZ) / 2;
      const bridge = new THREE.Mesh(new THREE.PlaneGeometry(18, gapW), MAT.basalt.clone());
      bridge.rotation.x = -Math.PI/2; bridge.position.set(0, 0.02, gapZ);
      sceneGroup.add(bridge);
    }
  });

  // Entry basalt
  const entryZ = (bands[0].zC + BAND_HALF) / 2 + 1.5;
  const entryLen = 2.0 + BAND_HALF + bands[0].zC + BAND_HALF;
  const entry = new THREE.Mesh(new THREE.PlaneGeometry(18, 4), MAT.basalt.clone());
  entry.rotation.x = -Math.PI/2; entry.position.set(0, 0.02, 0.5);
  sceneGroup.add(entry);

  // Exit basalt
  const lastZ = bands[bands.length-1].zC;
  const exitLen = Math.abs(EXIT_Z - (lastZ - BAND_HALF)) + 2;
  const exitBasalt = new THREE.Mesh(new THREE.PlaneGeometry(18, exitLen), MAT.basalt.clone());
  exitBasalt.rotation.x = -Math.PI/2;
  exitBasalt.position.set(0, 0.02, (lastZ - BAND_HALF + EXIT_Z) / 2 - 1);
  sceneGroup.add(exitBasalt);

  // Exit arch
  const arch = new THREE.Group(); arch.position.set(0, 0, EXIT_Z);
  const am = MAT.exit.clone();
  [[-1.4,1.5],[1.4,1.5]].forEach(([x,y]) => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.3,3,0.3), am.clone());
    p.position.set(x, 1.5, 0); arch.add(p);
  });
  const top = new THREE.Mesh(new THREE.BoxGeometry(3.1,0.3,0.3), am.clone());
  top.position.set(0, 3.15, 0); arch.add(top);
  const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8), am.clone());
  glowSphere.position.set(0, 1.8, 0); arch.add(glowSphere);
  sceneGroup.add(arch);

  // Boulders (roll left-to-right through lava bands)
  lvlDef.boulders.forEach((bDef, bi) => {
    const band = bands[bDef.band];
    const bm = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 10),
      new THREE.MeshStandardMaterial({color:0x332211,emissive:new THREE.Color(0xFF3A1A),emissiveIntensity:0.4}));
    bm.position.set(-10 + bi * 4, 0.55, band.zC);
    scene.add(bm);
    boulderObjs.push({ mesh:bm, bandIdx:bDef.band, spd:2.5 + lvlIdx*0.6 });
  });

  // Embers
  for (let i = 0; i < 18; i++) {
    const band = bands[Math.floor(Math.random() * bands.length)];
    const em = new THREE.Mesh(new THREE.SphereGeometry(0.05,4,4),
      new THREE.MeshStandardMaterial({color:0xFF6600,emissive:new THREE.Color(0xFF6600),emissiveIntensity:2,transparent:true}));
    em.position.set((Math.random()-0.5)*16, 0.2+Math.random()*0.6, band.zC + (Math.random()-0.5)*1.6);
    scene.add(em);
    embers.push({mesh:em, life:Math.random()*2, maxLife:1.5+Math.random()*0.5, vy:0.3+Math.random()*0.2, srcZ:band.zC});
  }

  // Player
  if (playerMesh) { scene.remove(playerMesh); scene.remove(playerRim); }
  playerMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.3,0.8,4,8), MAT.player.clone());
  playerMesh.position.set(0, 0.8, pZ);
  scene.add(playerMesh);
  playerRim = new THREE.Mesh(new THREE.CapsuleGeometry(0.33,0.82,4,8), MAT.prim.clone());
  playerRim.position.set(0, 0.8, pZ);
  scene.add(playerRim);
}

// ── CRYSTAL PLACEMENT ─────────────────────────────────────────────────────────
function placeCrystal(bandIdx, fromAuto) {
  if (bandIdx < 0) return;
  const band = lvlDef.bands[bandIdx];
  // Snap crystal to center of the lava band
  const cZ = band.zC;
  const cX = 0; // always on the player's path

  // Don't double-place crystals in same band
  if (crystals.find(c => c.bandIdx === bandIdx && !c.expired)) return;

  const spd = band.spd;
  let life = spd <= 1.5 ? 4600 : spd <= 3.5 ? 3700 : 2500;
  if (band.eddy) life *= 1.4;

  // Timing multiplier
  const dist = Math.abs(cZ - pZ);
  const tAhead = (dist / lvlDef.pSpd) * 1000;
  let mult = 1;
  if (tAhead >= BEAT_MS*3) mult = 4;
  else if (tAhead >= BEAT_MS*2) mult = 3;
  else if (tAhead >= BEAT_MS) mult = 2;

  const geo = new THREE.CylinderGeometry(0.38, 0.48, 0.2, 6);
  const mat = MAT.crystal.clone();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(cX, 0.12, cZ);
  scene.add(mesh);

  // Shadow ellipse (reveals current direction/speed)
  const sGeo = new THREE.EllipseGeometry(spd*0.13+0.18, 0.1, 12);
  const sMat = new THREE.MeshBasicMaterial({color:0xF5A030,transparent:true,opacity:0.55});
  const shadow = new THREE.Mesh(sGeo, sMat);
  shadow.rotation.x = -Math.PI/2;
  shadow.position.set(cX + spd*0.13, 0.025, cZ + 0.12);
  shadow.visible = false;
  scene.add(shadow);

  crystals.push({mesh, shadow, bandIdx, cZ, born:performance.now(), life, mult, eddy:!!band.eddy, scored:false, expired:false});
  playArp();

  // Score placement bonus
  if (!fromAuto) {
    score += 10 * mult;
    hasActed = true;
  }
}

// ── CRYSTAL UPDATE ────────────────────────────────────────────────────────────
function updateCrystals(now, dt) {
  for (let i = crystals.length-1; i >= 0; i--) {
    const c = crystals[i];
    if (c.expired) { scene.remove(c.mesh); if(c.shadow) scene.remove(c.shadow); crystals.splice(i,1); continue; }
    const age = now - c.born;
    const frac = age / c.life;
    // Growth animation
    if (age < 280) c.mesh.scale.setScalar(age/280);
    else c.mesh.scale.setScalar(1);
    // Shadow reveal
    if (age > 180 && c.shadow) c.shadow.visible = true;
    // Warning phase
    const warn = c.life - age;
    if (warn < 800) {
      const f = warn/800;
      c.mesh.material.color.setRGB(1, f*0.9, f*0.9);
      c.mesh.material.emissiveIntensity = 0.9 + Math.sin(now*0.025)*0.6;
      c.mesh.rotation.y += dt*5;
    }
    if (frac >= 1) {
      try { if(audioOk && sfxMelt) sfxMelt.triggerAttackRelease('8n'); } catch(e){}
      c.expired = true;
    }
  }
}

// ── BOULDER UPDATE ────────────────────────────────────────────────────────────
function updateBoulders(now, dt) {
  boulderObjs.forEach(b => {
    b.mesh.position.x += b.spd * dt;
    if (b.mesh.position.x > 11) b.mesh.position.x = -11;
    b.mesh.rotation.z += dt * 2;

    // Crystal shatter check
    const cInBand = crystals.find(c => c.bandIdx === b.bandIdx);
    if (cInBand && Math.abs(b.mesh.position.x - 0) < 1.2 && !cInBand.expired && now-cInBand.born < 250) {
      // Crystal placed under boulder in time → SHATTER
      score += 500;
      cInBand.expired = true;
      b.mesh.position.x = -11;
    }
  });
}

// ── PLAYER UPDATE ─────────────────────────────────────────────────────────────
let pBob = 0;
function updatePlayer(dt, now) {
  if (gameState !== 'playing') return;

  if (pSink > 0) {
    sinkTimer += dt;
    playerMesh.position.y = 0.8 - sinkTimer * 0.5;
    playerRim.position.y = playerMesh.position.y;
    if (playerMesh.position.y < -0.7) playerMesh.position.y = -0.7;
    return;
  }
  if (respTimer > 0) {
    respTimer -= dt;
    if (respTimer <= 0) { pSink=0; sinkTimer=0; pZ=chkZ; graceOn=false; graceTimer=0; }
    return;
  }

  // Advance
  pZ -= lvlDef.pSpd * dt;
  pBob += dt;
  const py = 0.8 + Math.sin(pBob * 3.0) * 0.04;
  playerMesh.position.set(0, py, pZ);
  playerRim.position.set(0, py, pZ);

  // Camera
  camera.position.set(0, 12, pZ + 12);
  camera.lookAt(0, 0, pZ - 2);
  lavaGlowL.position.set(0, 0.5, pZ - 6);
  rimL.position.set(-3, 3, pZ + 2);

  // Win check
  if (pZ <= EXIT_Z + 1.2) { triggerWin(); return; }

  // Death check: is player inside a lava band with no crystal?
  if (!hasActed) return; // no danger before first action
  let overLava = false;
  let inBandIdx = -1;
  lvlDef.bands.forEach((b, i) => {
    if (Math.abs(pZ - b.zC) < BAND_HALF) { overLava=true; inBandIdx=i; }
  });

  if (overLava) {
    const hasCrystal = crystals.find(c => c.bandIdx === inBandIdx && !c.expired);
    if (hasCrystal) {
      graceOn = false; graceTimer = 0;
      crossings++;
      if (crossings % 5 === 0) chkZ = pZ;
      if (!hasCrystal.scored) {
        hasCrystal.scored = true;
        score += 100 * hasCrystal.mult + (hasCrystal.eddy ? 50 : 0);
      }
    } else {
      if (!graceOn) { graceOn=true; graceTimer=0; }
      graceTimer += dt;
      if (graceTimer >= 0.5) triggerDeath();
    }
  } else {
    graceOn = false; graceTimer = 0;
  }
}

function triggerDeath() {
  if (pSink > 0 || respTimer > 0) return;
  lives--;
  pSink = 1;
  noDeathLvl = false;
  try { if(audioOk && sfxDeath) sfxDeath.triggerAttackRelease('2n'); } catch(e){}
  const flash = document.getElementById('flash');
  flash.style.opacity = '0.65';
  setTimeout(() => { flash.style.transition='opacity 1s'; flash.style.opacity='0'; }, 80);
  setTimeout(() => {
    if (lives <= 0) { showGameOver(); }
    else { pSink=0; sinkTimer=0; respTimer=2.0; }
  }, 1600);
}

function triggerWin() {
  if (gameState !== 'playing') return;
  gameState = 'win';
  if (noDeathLvl) score += 1000;
  try { if(audioOk && sfxWin) sfxWin.triggerAttackRelease(['A5','C#5','E5'],0.8); } catch(e){}
  const banner = document.getElementById('levelBanner');
  banner.textContent = lvlIdx < LEVELS.length-1 ? 'LEVEL CLEAR' : 'YOU WIN!';
  banner.style.opacity = '1';
  setTimeout(() => {
    banner.style.opacity = '0';
    lvlIdx++;
    if (lvlIdx < LEVELS.length) { startLevel(lvlIdx); }
    else { showGameOver(true); }
  }, 2500);
}

function showGameOver(win=false) {
  gameState = 'over';
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:15;background:rgba(43,16,0,0.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;';
  d.innerHTML = `<h2 style="color:${win?'#F5D060':'#FF3A1A'};font-size:clamp(24px,6vw,40px);font-family:monospace;text-shadow:0 0 28px currentColor;letter-spacing:0.3em">${win?'CALDERA CROSSED':'GAME OVER'}</h2><p style="color:#EFF0E8;font-size:clamp(14px,3vw,18px);font-family:monospace">Score: ${score}</p><p style="color:#F5D060;font-size:clamp(11px,2.5vw,13px);font-family:monospace;animation:blink 1s infinite">TAP TO RESTART</p>`;
  document.body.appendChild(d);
  d.addEventListener('pointerdown', () => { document.body.removeChild(d); startGame(); });
}

function startLevel(idx) {
  lvlIdx = idx; lvlDef = LEVELS[idx];
  pZ = 2.0; pSink=0; sinkTimer=0; respTimer=0;
  graceOn=false; graceTimer=0; chkZ=2.0; crossings=0;
  noDeathLvl=true; firstCrystal=true; hasActed=false; pBob=0;
  buildLevel(idx);
  const banner = document.getElementById('levelBanner');
  banner.textContent = `LEVEL ${idx+1}`;
  banner.style.opacity='1';
  setTimeout(()=>banner.style.opacity='0', 1800);
}

function startGame() {
  score=0; lives=3; lvlIdx=0;
  gameState = 'playing';
  startLevel(0);
}

// ── POINTER HANDLING ──────────────────────────────────────────────────────────
const ray = new THREE.Raycaster();
const pVec = new THREE.Vector2();
const lavaPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -0.01);
const target3 = new THREE.Vector3();

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  pVec.set(
    (e.clientX - rect.left) / rect.width * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  ray.setFromCamera(pVec, camera);
  if (!ray.ray.intersectPlane(lavaPlane, target3)) return;

  // Find which band was tapped (tap Z closest to a band center that's AHEAD of player)
  let bestBand = -1, bestDist = 999;
  lvlDef.bands.forEach((b, i) => {
    const dz = Math.abs(target3.z - b.zC);
    if (dz < BAND_HALF * 2.5 && dz < bestDist && b.zC < pZ + 1.0) {
      bestDist = dz; bestBand = i;
    }
  });
  if (bestBand >= 0) placeCrystal(bestBand, false);
}, {passive:false});

// ── EMBERS ────────────────────────────────────────────────────────────────────
function updateEmbers(dt) {
  for (let i = embers.length-1; i >= 0; i--) {
    const e = embers[i];
    e.life += dt;
    e.mesh.position.y += e.vy * dt;
    e.mesh.material.opacity = Math.sin(e.life/e.maxLife * Math.PI) * 0.85;
    if (e.life >= e.maxLife) {
      e.mesh.position.set((Math.random()-0.5)*16, 0.2, e.srcZ + (Math.random()-0.5)*1.6);
      e.life = 0;
    }
  }
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHud() {
  const c = ensureCtx(); if (!c) return;
  c.clearRect(0, 0, hud.width, hud.height);
  if (gameState !== 'playing' && gameState !== 'win') return;
  const W = hud.width, H = hud.height;
  c.textAlign = 'left'; c.font = 'bold 22px monospace';
  c.shadowColor = '#F5D060'; c.shadowBlur = 14;
  c.fillStyle = '#F5D060'; c.fillText(String(score), 22, 38);
  c.shadowBlur = 0;
  c.textAlign = 'right'; c.fillStyle = '#FF3A1A'; c.font = 'bold 20px monospace';
  c.fillText('♥'.repeat(Math.max(0, lives)), W-20, 38);
  c.textAlign = 'center'; c.fillStyle = '#EFF0E8'; c.globalAlpha = 0.65;
  c.font = '12px monospace'; c.fillText('LEVEL '+(lvlIdx+1), W/2, 34);
  c.globalAlpha = 1;
}

// ── SCREEN FLOW ───────────────────────────────────────────────────────────────
document.getElementById('startScreen').addEventListener('pointerdown', () => {
  const s = document.getElementById('startScreen');
  s.classList.add('hidden');
  setTimeout(() => s.style.display='none', 350);
  initAudio().catch(()=>{});
  const ins = document.getElementById('instrScreen');
  ins.style.display='flex';
  requestAnimationFrame(() => ins.classList.remove('hidden'));
  gameState = 'instructions';
}, {once:true});

document.getElementById('instrScreen').addEventListener('pointerdown', () => {
  const ins = document.getElementById('instrScreen');
  ins.classList.add('hidden');
  setTimeout(() => { ins.style.display='none'; startGame(); }, 310);
}, {once:true});

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
let lastT = performance.now();
// Build idle scene (start screen)
buildLevel(0);

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastT) / 1000, 0.05); lastT = ts;
  const now = ts;

  if (gameState === 'playing' || gameState === 'win') {
    updatePlayer(dt, now);
    updateCrystals(now, dt);
    updateBoulders(now, dt);
    updateEmbers(dt);
    // Lava glow pulse
    lavaMeshes.forEach(l => { l.mesh.material.emissiveIntensity = 1.3 + Math.sin(now*0.002)*0.4; });
    // Exit arch pulse
    const archGroup = sceneGroup.children.find(c => c.isGroup);
    if (archGroup) archGroup.children.forEach(c => { if(c.material?.emissive) c.material.emissiveIntensity = 1.5+Math.sin(now*0.0016*Math.PI)*0.5; });
    drawHud();
  } else if (gameState === 'start' || gameState === 'instructions') {
    // Idle: player character bobs at start
    if (playerMesh) {
      playerMesh.position.y = 0.8 + Math.sin(now*0.002)*0.06;
      playerRim.position.y = playerMesh.position.y;
    }
    lavaMeshes.forEach(l => { l.mesh.material.emissiveIntensity = 1.1 + Math.sin(now*0.002)*0.4; });
  }

  composer.render();
}
requestAnimationFrame(loop);

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  hud.width = window.innerWidth; hud.height = window.innerHeight;
});
</script>
